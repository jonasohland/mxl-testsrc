# mxl-testsrc
#
# A load generator. Each entry in `groups` is a flow spec with a count: it renders one StatefulSet
# whose pods each run one `mxl-gst-testsrc`, producing one video flow, one audio flow, or both, into
# a domain on one named node.
#
# Everything that has to differ between the flows of a group is templated on the pod's index. Write
# `%i` in `label`, `description` or `groupHint` and it is replaced with the index at startup. Flow
# ids are derived from the group and the index too, so a pod that restarts republishes the same flow
# rather than leaving the old one behind.
#
# This chart produces flows and nothing else. It does not know what consumes them and holds no
# opinion about it. Domain paths are absolute host paths, the same string inside the container and
# out, so whatever reads them sees the path written here.

# -- Override the name used for the chart's objects.
nameOverride: ""
# -- Override the fully qualified name (`<release>-<chart>`) entirely.
fullnameOverride: ""

image:
  registry: docker.io
  # The MXL distribution image, which carries `mxl-gst-testsrc` and `mxl-info`. This chart does not
  # build anything.
  repository: jonasohland/mxl
  # Empty means `.Chart.AppVersion`.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of imagePullSecrets in this namespace.
  pullSecrets: []

# Extra labels and annotations put on every object the chart creates.
commonLabels: {}
commonAnnotations: {}

# ---------------------------------------------------------------------------------------------
# Defaults, and the groups that override them.
# ---------------------------------------------------------------------------------------------
#
# `defaults` is merged under every entry in `groups`, deeply, so a group states only what differs.
# Lists replace rather than append: a group declaring `hostMounts` declares all of them.
#
# Nothing is produced until `groups` is non-empty. `defaults` on its own renders no objects.
defaults:
  # The node that runs this group, as `kubectl get nodes` prints it. Shorthand for a
  # `kubernetes.io/hostname` node selector, and the usual way to place a group, because a generator
  # you cannot locate produces flows you cannot address.
  #
  # Set `nodeSelector` instead to place a group by any other label. A group setting neither runs
  # wherever the scheduler puts it, which is rarely what a test fixture wants.
  node: ""
  nodeSelector: {}

  # The MXL domain, as an absolute path on the host. Created if missing. Several groups may share
  # one, on the same node or not — a domain is a directory of flow directories and the flow ids
  # here are unique per group.
  domain: /dev/shm/mxl0

  # How many pods, and therefore how many `%i` values. The first is `startIndex`, and they run up
  # from there.
  #
  # `startIndex` exists so two groups can share one `groupHint` format without colliding. It shifts
  # the templated index only; pod ordinals still start at zero.
  count: 1
  startIndex: 0

  # The group hint name, which is how a consumer selects these flows. `mxl-gst-testsrc` appends
  # `:video` or `:audio` itself, following the flow definition, so this is the name part alone and
  # a group producing both flows publishes both types under one name.
  #
  # It must contain `%i` when `count` is greater than one, or every pod in the group publishes
  # under the same name and nothing downstream can tell them apart. The chart refuses to render
  # otherwise.
  groupHint: "testsrc-%i"

  # The NMOS `label` and `description` of the flows. Both take `%i`.
  label: "mxl-gst-testsrc %i"
  description: "Generated by the mxl-testsrc chart"

  # The videotestsrc pattern. See
  # https://gstreamer.freedesktop.org/documentation/videotestsrc/index.html#GstVideoTestSrcPattern
  #
  # `smpte` is the default and the most expensive to generate. `black` or `solid-color` cost close
  # to nothing, which is what to reach for when the point is flow count rather than picture.
  pattern: smpte

  # The `-t` overlay text, burnt into the picture. Takes `%i`. Empty follows `label`, which is
  # usually what you want: it makes a flow identifiable on a monitor without a lookup.
  overlayText: ""

  video:
    enabled: true
    width: 1920
    height: 1080
    rate: {num: 30000, den: 1001}
    mediaType: video/v210
    bitDepth: 10
    colorspace: BT709
    interlaceMode: progressive

    # NMOS `components`. Empty derives them from `width`, `height` and `bitDepth` as 4:2:2, which
    # is what `video/v210` is. State them explicitly for any other sampling.
    components: []

    # The contents of `--video-options-file`. Empty passes no file, and the tool's own default of
    # 1 applies — one slice per sync, which is the most syscall-expensive setting there is. The
    # MXL docs suggest 60 for video. Worth raising before blaming a consumer for falling behind.
    #
    #   options: {maxCommitBatchSizeHint: 60, maxSyncBatchSizeHint: 60}
    options: {}

  audio:
    enabled: false
    rate: 48000
    # `channel_count` is MXL's own addition to the NMOS flow definition and is required.
    channels: 2
    mediaType: audio/float32
    bitDepth: 32
    # The MXL docs suggest 512 for audio. See the note under `video.options`.
    options: {}

  # Host directories mounted into the pods. The domain must be inside one of these or the container
  # cannot see it, and the chart refuses to render otherwise. `mountPath` should equal `hostPath`,
  # so the absolute domain path means the same thing on both sides of the container boundary.
  hostMounts:
    - name: dev-shm
      hostPath: /dev/shm
      mountPath: /dev/shm
      type: Directory

  # Remove this pod's flow directories when it shuts down.
  #
  # A flow directory outlives the process that wrote it, by design — that is how a consumer keeps
  # reading across a producer restart. For a fixture that is scaled up and down it is the wrong
  # default: scaling a group from 400 to 4 would leave 396 flows in the domain that no longer have
  # a producer, and anything discovering the domain would keep finding them.
  #
  # Turn it off to test what a consumer does with a producer that went away.
  cleanupOnExit: true

  # MXL_LOG_LEVEL for the generator processes.
  logLevel: info

  # How a change to this file reaches running pods.
  #
  # A StatefulSet rolls one pod at a time, in reverse ordinal order, whatever `podManagementPolicy`
  # says — that governs scaling and creation, not updates. Measured at roughly three seconds a pod,
  # so a group of 200 takes about ten minutes to roll, during which half of it is on the old spec.
  #
  # `{type: OnDelete}` hands that back to you: upgrade, then delete pods in whatever batches the
  # node can absorb, with `kubectl delete pod -l app.kubernetes.io/component=<group>`.
  updateStrategy:
    type: RollingUpdate

  # Per pod, so one video flow plus one audio flow. A 1080p v210 flow at 30 fps is 5.3 MiB per
  # grain and about 166 MB/s of writes, and the ring buffer for it is a small multiple of one
  # grain. Those pages fault into this pod's cgroup, so the limit has to cover them.
  resources:
    requests:
      cpu: "1"
      memory: 256Mi
    limits:
      memory: 1Gi

  podAnnotations: {}
  podLabels: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 10

  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  # Appended verbatim to the `mxl-gst-testsrc` argument list, for anything the chart does not
  # surface, for example `[--video-offset, "2"]`.
  extraArgs: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# The groups themselves. `name` is required, must be unique, and becomes the StatefulSet's suffix.
# It also seeds the flow ids, so renaming a group republishes its flows under new ids.
#
#   groups:
#     - name: n0-hd
#       node: fabrics-on-k8-n0
#       count: 4
#       label: "my testsrc %i"
#       groupHint: "testsrc-%i"
#       video: {width: 1920, height: 1080, rate: {num: 25, den: 1}}
#       audio: {enabled: true, rate: 48000}
#
#     - name: n0-small
#       node: fabrics-on-k8-n0
#       count: 200
#       startIndex: 100
#       pattern: black
#       video: {width: 320, height: 180, rate: {num: 25, den: 1}}
groups: []
